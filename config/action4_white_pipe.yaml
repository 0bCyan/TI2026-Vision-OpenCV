# DJI Osmo Action 4 + 当前白色水管的桌面预览配置（2026-07-31）。
# 这是独立的非严格测试档：不启用串口/UDP，毫米标定仍是占位值，不能用于正式控制。
# 最终720p/180fps高速相机仍使用default.yaml，并在固定安装后重新选择ROI、背景和标定点。
camera:
  source: 1
  backend: dshow
  width: 1280
  height: 720
  fps: 30.0
  fourcc: MJPG
  buffer_size: 1
  reconnect_seconds: 1.0
  read_timeout_seconds: 0.05
  warmup_seconds: 0.5
  strict_contract: false
  min_measured_fps_ratio: 0.80
  max_interval_p99_ms: 40.0
  max_frame_gap_ms: 80.0
  max_read_p95_ms: 30.0
  max_read_failures: 3
  # Action 4不复用高速工业相机的DirectShow曝光档位。
  controls: {}
  strict_control_readback: false
  controls_verified_externally: false
  fingerprint_frames: false
  reject_identical_frames: false
  freshness_verified_externally: false

# 实拍白管只占约85行。收紧ROI可防止黑色底盘主导自适应阈值。
roi:
  x: 40
  y: 350
  width: 1200
  height: 85

detector:
  threshold:
    polarity: dark
    median_blur_size: 5
    min_contrast_delta: 16.0
    std_gain: 0.35
    threshold_min: 45
    threshold_max: 190
    # 全局暗阈值再与41 px局部均值差相交，切断钢球与左侧阴影/接头的粘连。
    local_contrast_enabled: true
    local_contrast_kernel_size: 41
    local_contrast_threshold: 12
    # 空管背景采自当前固定机位；与暗球强度掩膜相交，抑制接头、阴影和刻度纹理。
    background_enabled: true
    background_path: data/action4_white_pipe_background.png
    background_diff_threshold: 18
    background_brightness_align: true
    combine_mode: and
    morph_open_size: 3
    morph_close_size: 7
  radius_min_px: 10.0
  radius_max_px: 22.0
  expected_radius_px: 15.5
  radius_tolerance_search_ratio: 0.40
  radius_tolerance_track_ratio: 0.30
  area_min_px: 220.0
  area_max_px: 1800.0
  circularity_min: 0.40
  fill_ratio_min: 0.42
  aspect_ratio_min: 0.55
  aspect_ratio_max: 1.75
  channel_center_y_px: 41.0
  max_center_y_error_px: 28.0
  radius_continuity_max_ratio: 0.08
  predictive_search_enabled: true
  predictive_search_y_half_height_px: 28.0
  # 实拍钢球存在高光内环；径向极性边缘并与粗轮廓强一致，禁止内外环换边。
  edge_refine_method: radial
  edge_center_shift_max_ratio: 0.06
  edge_radius_shift_max_ratio: 0.06
  edge_radial_spokes: 72
  edge_radial_step_px: 0.35
  edge_radius_prior_sigma_px: 1.0
  edge_radial_gradient_min: 3.0
  edge_min_spoke_ratio: 0.45
  edge_radial_residual_px: 0.8
  edge_coarse_radius_outlier_ratio: 0.12
  edge_recovery_prior_sigma_px: 2.0
  edge_recovery_shift_max_ratio: 0.10
  edge_temporal_radius_weight: 0.80

# 2026-07-31两点实测：615.889810 px=0 mm，648.054020 px=10 mm。
# 比例为0.310904574 mm/px；0和1279 px处的坐标由这两个实测点线性外推。
calibration:
  mode: piecewise_linear
  degree: 1
  points:
    - [0.0, -191.482958853956]
    - [615.889810, 0.0]
    - [648.054020, 10.0]
    - [1279.0, 206.163990970087]

# Action 4在OpenCV下实测约15fps，不能沿用180fps相机的25ms预测新鲜度。
tracker:
  max_prediction_ms: 90.0
  lost_reset_ms: 250.0
  max_dt_seconds: 0.08

output:
  serial_enabled: false
  udp_enabled: false

# 网页/录像服务全程常驻；独立低优先级线程限速发布，不阻塞识别与串口。
frame_stream:
  enabled: true
  socket_path: ${XDG_RUNTIME_DIR}/video-link-frames.sock
  max_fps: 10.0
  max_width: 640
  jpeg_quality: 70
  max_frame_bytes: 2097152
  connect_retry_seconds: 1.0
  send_timeout_seconds: 0.25

display:
  enabled: true
  max_fps: 30.0
  scale: 0.65
  show_mask: true
  draw_candidates: true

logging:
  enabled: true
  directory: logs
  flush_interval_seconds: 1.0

runtime:
  opencv_threads: 1
  opencl_enabled: false
  disable_python_gc: true
